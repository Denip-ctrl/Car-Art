<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Art</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #030712;
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Sci-fi Background Effects & Sparkling Light Animation */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(0, 162, 255, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(255, 140, 0, 0.1) 0%, transparent 40%);
            z-index: -1;
        }

        .sparkle {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            animation: twinkle var(--duration) infinite ease-in-out;
            z-index: 0;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); box-shadow: 0 0 8px #00d2ff; }
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            border-bottom: 1px solid rgba(0, 210, 255, 0.3);
            background: rgba(3, 7, 18, 0.8);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 26px;
            font-weight: bold;
            font-style: italic;
            letter-spacing: 2px;
            color: #e0f2fe;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.8), 0 0 20px rgba(0, 210, 255, 0.5);
        }

        .search-bar {
            position: relative;
            width: 250px;
        }

        .search-bar input {
            width: 100%;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(0, 210, 255, 0.4);
            border-radius: 4px;
            padding: 8px 12px;
            color: #fff;
            outline: none;
            transition: all 0.3s;
        }

        .search-bar input:focus {
            border-color: #00d2ff;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.4);
        }

        /* Hamburger Menu for Mobile */
        .menu-toggle {
            display: none;
            background: none;
            border: 1px solid rgba(0, 210, 255, 0.5);
            color: #00d2ff;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 18px;
        }

        /* Layout Container */
        .container {
            display: flex;
            min-height: calc(100vh - 70px);
            position: relative;
        }

        /* Left Sidebar Controls */
        .sidebar {
            width: 320px;
            background: rgba(10, 15, 30, 0.9);
            border-right: 1px solid rgba(0, 210, 255, 0.3);
            padding: 20px;
            backdrop-filter: blur(15px);
            display: flex;
            flex-direction: column;
            gap: 20px;
            transition: transform 0.3s ease;
            z-index: 999;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .control-group label {
            font-size: 13px;
            font-weight: 600;
            color: #93c5fd;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .control-group select, .control-group input[type="text"] {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(0, 210, 255, 0.3);
            border-radius: 6px;
            padding: 10px;
            color: #fff;
            outline: none;
            font-size: 14px;
        }

        /* Propulsion Checkboxes */
        .checkbox-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(0, 210, 255, 0.3);
            padding: 10px;
            border-radius: 6px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            cursor: pointer;
            color: #e2e8f0;
        }

        .checkbox-label input {
            accent-color: #00d2ff;
            width: 16px;
            height: 16px;
        }

        /* Enter Button */
        .enter-btn {
            background: linear-gradient(135deg, #00d2ff, #0072ff);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.4);
            transition: all 0.3s;
            margin-top: 10px;
        }

        .enter-btn:hover {
            box-shadow: 0 0 25px rgba(0, 210, 255, 0.8);
            transform: translateY(-2px);
        }

        /* Main Content / Display Area */
        .main-content {
            flex: 1;
            padding: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Initial Placeholder State */
        .placeholder-state {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .placeholder-state p {
            color: #94a3b8;
            font-size: 16px;
            letter-spacing: 0.5px;
        }

        /* Results Grid */
        .results-grid {
            display: none;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            padding-right: 10px;
        }

        .car-card {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(0, 210, 255, 0.3);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            transition: transform 0.3s, border-color 0.3s;
        }

        .car-card:hover {
            transform: translateY(-5px);
            border-color: #00d2ff;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.5);
        }

        .car-img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-bottom: 1px solid rgba(0, 210, 255, 0.2);
        }

        .car-info {
            padding: 15px;
        }

        .car-title {
            font-size: 18px;
            font-weight: bold;
            color: #f8fafc;
            margin-bottom: 5px;
        }

        .car-specs {
            font-size: 12px;
            color: #94a3b8;
        }

        /* Responsive Design for Mobile */
        @media (max-width: 768px) {
            .menu-toggle {
                display: block;
            }

            .sidebar {
                position: absolute;
                top: 0;
                left: 0;
                height: 100%;
                transform: translateX(-100%);
            }

            .sidebar.active {
                transform: translateX(0);
            }

            .main-content {
                padding: 15px;
            }
        }
    </style>
</head>
<body>

    <header>
        <button class="menu-toggle" id="menuToggle">&#9776;</button>
        <div class="logo">Car Art</div>
        <div class="search-bar">
            <input type="text" id="globalSearch" placeholder="Search models...">
        </div>
    </header>

    <div class="container">
        
        <aside class="sidebar" id="sidebar">
            <div class="control-group">
                <label>Vehicle Type</label>
                <select id="vehicleType">
                    <option value="">Select Vehicle Type</option>
                    <option value="sedan">Sedan</option>
                    <option value="suv">SUV</option>
                    <option value="sports">Sports Car</option>
                </select>
            </div>

            <div class="control-group">
                <label>Brand</label>
                <select id="brand">
                    <option value="">Select Brand</option>
                    <option value="toyota">Toyota</option>
                    <option value="honda">Honda</option>
                    <option value="nissan">Nissan</option>
                    <option value="tesla">Tesla</option>
                </select>
            </div>

            <div class="control-group">
                <label>Model Series</label>
                <input type="text" id="modelSeries" placeholder="Type series name...">
            </div>

            <div class="control-group">
                <label>Propulsion</label>
                <div class="checkbox-group">
                    <label class="checkbox-label"><input type="checkbox" name="propulsion" value="electric"> Electric</label>
                    <label class="checkbox-label"><input type="checkbox" name="propulsion" value="diesel"> Diesel</label>
                    <label class="checkbox-label"><input type="checkbox" name="propulsion" value="fuel"> Fuel</label>
                    <label class="checkbox-label"><input type="checkbox" name="propulsion" value="hydrogen"> Hydrogen</label>
                </div>
            </div>

            <div class="control-group">
                <label>Year Range</label>
                <input type="text" id="yearRange" placeholder="e.g., 2000-2010...">
            </div>

            <button class="enter-btn" id="enterBtn">Enter</button>
        </aside>

        <main class="main-content">
            <div class="placeholder-state" id="placeholderState">
                <svg width="320" height="180" viewBox="0 0 400 220" style="filter: drop-shadow(0 0 10px rgba(0,210,255,0.5))">
                    <path d="M50 140 Q 200 40 350 140 L 370 170 L 30 170 Z" fill="none" stroke="#00d2ff" stroke-width="2" stroke-dasharray="5 5"/>
                    <circle cx="110" cy="170" r="25" fill="none" stroke="#00d2ff" stroke-width="3"/>
                    <circle cx="290" cy="170" r="25" fill="none" stroke="#00d2ff" stroke-width="3"/>
                </svg>
                <p>Search or select criteria to begin exploring the collection.</p>
            </div>

            <div class="results-grid" id="resultsGrid">
                <div class="car-card">
                    <img src="https://images.unsplash.com/photo-1552519507-da3b142c6e3d?auto=format&fit=crop&w=600&q=80" alt="Car" class="car-img">
                    <div class="car-info">
                        <div class="car-title">Crown 1998</div>
                        <div class="car-specs">2.5L V6 Engine | Auto Transmission</div>
                    </div>
                </div>
                <div class="car-card">
                    <img src="https://images.unsplash.com/photo-1583121274602-3e2820c69888?auto=format&fit=crop&w=600&q=80" alt="Car" class="car-img">
                    <div class="car-info">
                        <div class="car-title">Crown 2012</div>
                        <div class="car-specs">3.5L V6 Engine | Auto Transmission</div>
                    </div>
                </div>
            </div>
        </main>

    </div>

    <script>
        // Sparkling Light Generator Background
        const body = document.body;
        for (let i = 0; i < 40; i++) {
            const sparkle = document.createElement('div');
            sparkle.classList.add('sparkle');
            sparkle.style.top = Math.random() * 100 + 'vh';
            sparkle.style.left = Math.random() * 100 + 'vw';
            sparkle.style.width = (Math.random() * 3 + 1) + 'px';
            sparkle.style.height = sparkle.style.width;
            sparkle.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
            sparkle.style.animationDelay = (Math.random() * 2) + 's';
            body.appendChild(sparkle);
        }

        // Toggle Sidebar for Mobile via Hamburger Icon
        const menuToggle = document.getElementById('menuToggle');
        const sidebar = document.getElementById('sidebar');

        menuToggle.addEventListener('click', () => {
            sidebar.classList.toggle('active');
        });

        // Trigger Filter and Show Results on Enter Click
        const enterBtn = document.getElementById('enterBtn');
        const placeholderState = document.getElementById('placeholderState');
        const resultsGrid = document.getElementById('resultsGrid');

        enterBtn.addEventListener('click', () => {
            // Sembunyikan panduan awal dan tampilkan grid hasil mobil
            placeholderState.style.display = 'none';
            resultsGrid.style.display = 'grid';

            // Jika di HP, otomatis tutup sidebar setelah klik Enter
            if (window.innerWidth <= 768) {
                sidebar.classList.remove('active');
            }
        });
    </script>
</body>
</html>
